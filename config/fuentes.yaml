# Fuentes publicas del COES. Detalle y hallazgos en docs/fuentes_coes.md
# Fechas en los parametros del portal: dd/mm/aaaa
#
# Campos descriptivos de cada fuente (se muestran en la pantalla "Metodo y fuentes"):
#   frecuencia_objetivo  cada cuanto tiene sentido consultarla
#   retraso_esperado     cuanto tarda el COES en publicar un dato nuevo
#   estado_dato          preliminar (puede cambiar) o post_operacion (evaluado por el COES)
#   url_fuente           pagina publica donde cualquiera puede verificar el dato
# La "ultima extraccion exitosa" no va aqui (cambia en cada corrida): se guarda en
# data/estado_fuentes.json y se muestra en la app.

cliente:
  user_agent: "CuantoCOESta/0.3 (bot open source; data publica COES)"
  pausa_segundos: 2.0        # espera minima entre dos pedidos al servidor
  timeout_segundos: 180
  reintentos: 3
  # Dias recientes que el COES aun puede corregir: se vuelven a bajar
  # si la copia en cache tiene mas de horas_vigencia_reciente horas
  dias_provisionales: 3
  horas_vigencia_reciente: 6
  # Red corporativa: el proxy de Windows se usa solo. Si TI da uno distinto,
  # ponerlo aqui, por ejemplo "http://proxy.empresa.com:8080". Vacio = automatico.
  proxy: ""
  # true = confiar en los certificados instalados en Windows (necesario si la red
  # inspecciona el trafico SSL; sin esto las descargas fallan con error de certificado)
  certificados_sistema: true

portal: "https://www.coes.org.pe/Portal"

# ---------------------------------------------------------------------------
# Ciclo semanal (run_weekly.py)
# ---------------------------------------------------------------------------
fuentes:
  demanda:
    mvp: true
    ciclo: semanal
    descripcion: "Demanda del SEIN cada 30 min: ejecutada, programa diario y semanal (MW)"
    frecuencia_objetivo: "semanal"
    retraso_esperado: "minutos"
    estado_dato: preliminar
    url_fuente: "https://www.coes.org.pe/Portal/portalinformacion/demanda"
    pagina: "/portalinformacion/demanda"
    url: "/portalinformacion/ExportarDemanda"
    metodo: GET
    formato: xlsx
    params: {fechaInicial: "{desde}", fechaFinal: "{hasta}"}
    max_dias_por_pedido: 31

  generacion:
    mvp: true
    ciclo: semanal
    descripcion: "Produccion por tipo de recurso y por central cada 30 min (MW)"
    frecuencia_objetivo: "semanal"
    retraso_esperado: "horas"
    estado_dato: preliminar
    url_fuente: "https://www.coes.org.pe/Portal/portalinformacion/generacion"
    pagina: "/portalinformacion/generacion"
    url: "/portalinformacion/Generacion"
    metodo: POST
    formato: json
    params: {fechaInicial: "{desde}", fechaFinal: "{hasta}", indicador: 0}
    max_dias_por_pedido: 1    # el endpoint ignora el rango: solo devuelve el primer dia

  costo_marginal:
    mvp: true
    ciclo: semanal
    descripcion: "Costo marginal de corto plazo por barra cada 30 min (S/ por MWh), version post operacion del IEOD"
    frecuencia_objetivo: "semanal"
    retraso_esperado: "1 a 2 días"
    estado_dato: post_operacion
    url_fuente: "https://www.coes.org.pe/Portal/PostOperacion/Reportes/Ieod"
    pagina: "/PostOperacion/Reportes/Ieod"
    url: "/browser/download"
    metodo: IEOD_ZIP
    formato: xlsx
    # Dentro del zip diario solo se conserva este Excel (275 KB de 5.4 MB)
    ruta_ieod: "Post Operación/Reportes/IEOD/{anio}/{mes_carpeta}/{dia}/CMg{aaaammdd}.zip"
    # Se busca por nombre: a veces viene dentro de una carpeta CMgAAAAMMDD/ y a veces no
    miembro_zip: "CMgCP{ddmm}.xlsx"
    max_dias_por_pedido: 1

  costo_marginal_tr:
    mvp: true
    ciclo: semanal
    respaldo_de: costo_marginal
    descripcion: "Costo marginal en tiempo real (barras >= 138 kV). Se usa como respaldo y para medir cuanto cambia el dato preliminar"
    frecuencia_objetivo: "semanal"
    retraso_esperado: "30 minutos"
    estado_dato: preliminar
    url_fuente: "https://www.coes.org.pe/Portal/mercadomayorista/costosmarginales"
    pagina: "/mercadomayorista/costosmarginales"
    url: "/mercadomayorista/costosmarginales/ExportarMasivo"
    metodo: GET
    formato: xlsx
    params: {fechaInicio: "{desde}", fechaFin: "{hasta}", defecto: "S"}
    max_dias_por_pedido: 30

  ieod_anexo:
    mvp: true
    ciclo: semanal
    descripcion: "Anexo A del Informe de Evaluacion de la Operacion Diaria: 46 hojas (embalses, caudales, eventos, mantenimientos)"
    frecuencia_objetivo: "semanal"
    retraso_esperado: "1 a 2 días"
    estado_dato: post_operacion
    url_fuente: "https://www.coes.org.pe/Portal/PostOperacion/Reportes/Ieod"
    pagina: "/PostOperacion/Reportes/Ieod"
    url: "/browser/download"
    metodo: IEOD
    formato: xlsx
    ruta_ieod: "Post Operación/Reportes/IEOD/{anio}/{mes_carpeta}/{dia}/AnexoA_{ddmm}.xlsx"
    max_dias_por_pedido: 1

# ---------------------------------------------------------------------------
# Ciclo frecuente: "Cuanto COESta Ahora" (python -m src.ahora)
# Solo lo que el COES publica de verdad cada media hora. Si no hay dato nuevo,
# se conserva el ultimo y se muestra su antiguedad: nunca se inventa una actualizacion.
# ---------------------------------------------------------------------------
ahora:
  cada_minutos: 30
  costo_marginal:
    descripcion: "Costo marginal en tiempo real por barra (>= 138 kV), un proceso cada 30 min"
    frecuencia_objetivo: "30 minutos"
    retraso_esperado: "~30 minutos"
    estado_dato: preliminar
    url_fuente: "https://www.coes.org.pe/Portal/mercadomayorista/costosmarginales"
    url_procesos: "/mercadomayorista/costosmarginales/listaproceso"   # POST fecha -> procesos del dia
    url_lista: "/mercadomayorista/costosmarginales/lista"             # POST correlativo -> tabla de barras
    defecto: "S"
    # Procesos recientes que se vuelven a consultar para detectar revisiones del COES
    revisar_ultimos: 2
  demanda:
    descripcion: "Demanda ejecutada del SEIN y programa del dia, cada 30 min"
    frecuencia_objetivo: "30 minutos"
    retraso_esperado: "~1 minuto"
    estado_dato: preliminar
    url_fuente: "https://www.coes.org.pe/Portal/portalinformacion/demanda"
    url: "/portalinformacion/Demanda"                                  # POST fechaInicial, fechaFinal -> JSON

# Carpetas de mes del IEOD (ojo: "Setiembre", no "Septiembre")
meses_ieod: [Enero, Febrero, Marzo, Abril, Mayo, Junio, Julio, Agosto, Setiembre, Octubre, Noviembre, Diciembre]

# Barra de referencia para precios: Santa Rosa 220 kV (Lima), la barra de
# referencia historica del SEIN para tarifas en barra
barra_referencia: "SANTA ROSA 220"
