# Fuentes de datos publicas. Detalle y hallazgos en docs/fuentes_coes.md
# Fechas en los parametros: formato dd/mm/aaaa (lo exige el portal COES)

cliente:
  user_agent: "PulsoElectricoPeru/0.1 (bot open source; data publica COES)"
  pausa_segundos: 2.0        # espera minima entre dos pedidos al servidor
  timeout_segundos: 120
  reintentos: 3
  # Dias recientes que el COES aun puede corregir: se vuelven a bajar
  # si la copia en cache tiene mas de horas_vigencia_reciente horas
  dias_provisionales: 3
  horas_vigencia_reciente: 6

fuentes:
  demanda:
    descripcion: "Demanda del SEIN cada 30 min: ejecutada, programa diario y semanal (MW)"
    pagina: "https://www.coes.org.pe/Portal/portalinformacion/demanda"
    url: "https://www.coes.org.pe/Portal/portalinformacion/ExportarDemanda"
    metodo: GET
    formato: xlsx
    params:
      fechaInicial: "{desde}"
      fechaFinal: "{hasta}"
    max_dias_por_pedido: 31

  generacion:
    descripcion: "Produccion por central y por tipo de recurso cada 30 min (MW)"
    pagina: "https://www.coes.org.pe/Portal/portalinformacion/generacion"
    url: "https://www.coes.org.pe/Portal/portalinformacion/Generacion"
    metodo: POST
    formato: json
    params:
      fechaInicial: "{desde}"
      fechaFinal: "{hasta}"
      indicador: 0
    # El endpoint ignora el rango y solo devuelve el primer dia: pedir dia por dia
    max_dias_por_pedido: 1

  costo_marginal:
    descripcion: "Costo marginal por barra (>= 138 kV) cada 30 min (S/ por MWh)"
    pagina: "https://www.coes.org.pe/Portal/mercadomayorista/costosmarginales"
    url: "https://www.coes.org.pe/Portal/mercadomayorista/costosmarginales/ExportarMasivo"
    metodo: GET
    formato: xlsx
    params:
      fechaInicio: "{desde}"
      fechaFin: "{hasta}"
      defecto: "S"            # S = barras mayores a 138 kV ; vacio = todas
    max_dias_por_pedido: 30   # la web rechaza rangos de mas de 30 dias
