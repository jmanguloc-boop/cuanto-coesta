# Parametros de los indicadores semanales. Documentados en PROGRESO.md (Decisiones).

barra_referencia: "SANTA ROSA 220"   # Lima; se repite aqui para no depender de fuentes.yaml

umbrales_precio:                     # S/ por MWh, sobre la barra de referencia
  bajo: 100      # ~27 USD/MWh: precio de sistema con mucha agua, sol y viento
  alto: 500      # ~135 USD/MWh: senal de que entran centrales caras (diesel, gas en ciclo simple)

# Cuanto tiene que cambiar un indicador vs la semana anterior para ser "noticia"
relevancia:
  cmg_promedio: 0.10            # 10 %
  demanda_maxima: 0.03
  energia_semana: 0.03
  participacion_renovable: 0.03 # 3 puntos porcentuales
  volumen_embalses: 0.05

semanas_minimas_para_record: 4  # no se habla de "record" con menos historia que esto

# Deteccion de rarezas: un valor es raro para su hora si se aleja mucho de lo
# habitual a esa misma hora en los dias previos. Se usa mediana y MAD (robustas
# a picos), no promedio y desviacion estandar.
rarezas:
  dias_historia: 28           # ventana de comparacion
  minimo_observaciones: 7     # con menos historia no se juzga
  z_robusto: 3.5              # |valor - mediana| / (1.4826 * MAD)
  diferencia_minima: 60       # S/ por MWh: ademas debe alejarse al menos esto
  salto_intervalo_pct: 0.40   # salto vs media hora anterior que se reporta como "salto brusco"
  salto_intervalo_min: 120    # ... y al menos estos S/ por MWh
