# Fuente unica de verdad para todo texto explicativo (dashboard y PDF).
# Claves sin tildes; los textos si llevan tildes porque los lee el publico.
# Nunca usar guion largo en estos textos.
#
# Campos:
#   nombre             como se muestra
#   explicacion_simple maximo 2 lineas, para alguien sin conocimiento tecnico
#   por_que_importa    1 linea
#   unidad             unidad en que se muestra
#   ejemplo_cotidiano  opcional, comparacion con la vida diaria

indicadores:
  cmg_promedio:
    nombre: "Costo marginal promedio"
    explicacion_simple: >
      Lo que costó producir el último MWh que necesitó el sistema, promediado en la
      semana. Si sube, la electricidad se volvió más cara de producir.
    por_que_importa: "Es el precio mayorista de la electricidad: a la larga empuja lo que pagan empresas y hogares."
    unidad: "S/ por MWh"
    ejemplo_cotidiano: >
      Como el precio del pasaje en hora punta: cuando hay mucha gente, el último
      pasajero lo paga más caro.

  cmg_maximo:
    nombre: "Precio más alto de la semana"
    explicacion_simple: >
      El costo marginal más alto que se registró en una media hora de la semana.
      Suele aparecer cuando hay que prender centrales caras para cubrir el consumo.
    por_que_importa: "Muestra qué tan caro se pone producir electricidad en los momentos más ajustados."
    unidad: "S/ por MWh"

  cmg_minimo:
    nombre: "Precio más bajo de la semana"
    explicacion_simple: >
      El costo marginal más bajo de la semana. Aparece cuando sobra energía barata,
      por ejemplo de madrugada o con mucho sol y agua.
    por_que_importa: "Indica cuándo la electricidad fue más barata de producir."
    unidad: "S/ por MWh"

  horas_precio_bajo:
    nombre: "Horas con precio bajo"
    explicacion_simple: >
      Cuántas horas de la semana el costo marginal estuvo por debajo de S/ 100 por MWh.
      Son horas en las que la energía fue especialmente barata.
    por_que_importa: "Más horas baratas significa un sistema con energía sobrante y de bajo costo."
    unidad: "horas"

  horas_precio_alto:
    nombre: "Horas con precio alto"
    explicacion_simple: >
      Cuántas horas de la semana el costo marginal superó S/ 500 por MWh, una señal
      de que se encendieron centrales caras.
    por_que_importa: "Muchas horas caras encarecen la operación del sistema."
    unidad: "horas"

  perfil_horario:
    nombre: "Precio según la hora del día"
    explicacion_simple: >
      El costo marginal promedio de cada hora, de 0 a 23, juntando los 7 días de la
      semana. Muestra en qué momentos del día la electricidad sale más cara.
    por_que_importa: "Ayuda a ver cuándo conviene consumir y cuándo el sistema está más exigido."
    unidad: "S/ por MWh"

  demanda_maxima:
    nombre: "Demanda máxima"
    explicacion_simple: >
      El momento de la semana en que el país pidió más electricidad a la vez.
      El sistema tiene que estar listo para cubrir ese pico, aunque dure poco.
    por_que_importa: "Define cuántas centrales y líneas necesita el país para no quedarse corto."
    unidad: "MW"
    ejemplo_cotidiano: >
      Como la hora de mayor afluencia en un restaurante: hay que tener mesas para
      ese momento aunque el resto del día sobren.

  energia_semana:
    nombre: "Energía consumida en la semana"
    explicacion_simple: >
      Toda la electricidad que usó el país en los 7 días: hogares, comercios, minas
      e industrias juntos. 1 GWh equivale a un millón de kWh, la unidad de tu recibo.
    por_que_importa: "Si crece, suele ser señal de más actividad económica."
    unidad: "GWh"

  error_programa_diario:
    nombre: "Diferencia con lo programado"
    explicacion_simple: >
      Cuánto se alejó, en promedio, el consumo real de lo que el COES estimó el día
      anterior. Un número bajo significa que el pronóstico fue bueno.
    por_que_importa: "Un buen pronóstico permite encender solo las centrales necesarias."
    unidad: "%"

  mix_generacion:
    nombre: "Mix de generación"
    explicacion_simple: >
      De qué fuentes salió la electricidad de la semana: agua, gas, sol, viento y
      otras, como porcentaje del total producido.
    por_que_importa: "El mix define cuánto cuesta la electricidad y cuánto contamina."
    unidad: "%"

  participacion_renovable:
    nombre: "Energía renovable (con hidro)"
    explicacion_simple: >
      Qué parte de la electricidad vino de fuentes que no se agotan: agua, sol,
      viento y biomasa.
    por_que_importa: "Más renovable suele significar menos emisiones y menos dependencia del gas."
    unidad: "%"

  participacion_renovable_sin_hidro:
    nombre: "Energía renovable sin hidro"
    explicacion_simple: >
      Lo mismo, pero sin contar las hidroeléctricas: solo sol, viento y biomasa,
      las fuentes nuevas que más están creciendo.
    por_que_importa: "Mide el avance de las renovables no convencionales en el Perú."
    unidad: "%"

  precio_capturado_solar:
    nombre: "Precio capturado por la solar"
    explicacion_simple: >
      El precio promedio de las horas en que produjeron las centrales solares,
      pesado por cuánto produjeron. Se compara con el promedio simple de la semana.
    por_que_importa: "Si es menor que el promedio, la solar produce justo cuando la energía está barata."
    unidad: "S/ por MWh"
    ejemplo_cotidiano: >
      Como un vendedor de helados que solo vende al mediodía: le importa el precio
      del mediodía, no el del día entero.

  precio_capturado_eolica:
    nombre: "Precio capturado por la eólica"
    explicacion_simple: >
      El precio promedio de las horas en que produjeron los parques eólicos, pesado
      por cuánto produjeron.
    por_que_importa: "Compara si el viento sopla en horas caras o baratas."
    unidad: "S/ por MWh"

  volumen_embalses:
    nombre: "Agua en los embalses"
    explicacion_simple: >
      El agua almacenada en los principales embalses y reservorios que usan las
      hidroeléctricas, al cierre de la semana. 1 Hm3 son mil millones de litros.
    por_que_importa: "Más agua guardada permite producir electricidad barata en los meses secos."
    unidad: "Hm3"
    ejemplo_cotidiano: "Como la alcancía del sistema: lo que se guarda en lluvias se gasta en la sequía."

terminos:
  coes:
    nombre: "COES"
    explicacion_simple: >
      El Comité de Operación Económica del Sistema: la institución que decide, minuto
      a minuto, qué centrales producen para que no falte luz y al menor costo.
    por_que_importa: "Todos los datos de este sitio vienen de su portal público."

  sein:
    nombre: "SEIN"
    explicacion_simple: >
      El Sistema Eléctrico Interconectado Nacional: la red que une centrales, líneas de
      alta tensión y ciudades de casi todo el Perú.
    por_que_importa: "Lo que se produce en una central de los Andes puede encender un foco en Lima."

  mw:
    nombre: "MW (megavatio)"
    explicacion_simple: >
      Mide potencia: cuánta electricidad se usa o produce en un instante. Es como la
      velocidad de un auto.
    por_que_importa: "Sirve para hablar de picos de consumo y del tamaño de las centrales."
    unidad: "MW"

  mwh:
    nombre: "MWh (megavatio hora)"
    explicacion_simple: >
      Mide energía: electricidad acumulada en el tiempo, como los kilómetros recorridos.
      1 MW durante una hora da 1 MWh, que son 1,000 kWh de tu recibo.
    por_que_importa: "Es la unidad en que se compra y vende la electricidad mayorista."
    unidad: "MWh"

  barra:
    nombre: "Barra (nodo)"
    explicacion_simple: >
      Un punto de la red eléctrica, normalmente una subestación, donde se cruzan líneas
      de alta tensión. Cada barra puede tener un precio distinto.
    por_que_importa: "Por eso se elige una barra de referencia para seguir el precio."

  barra_referencia:
    nombre: "Barra de referencia"
    explicacion_simple: >
      Usamos la barra Santa Rosa 220 kV, en Lima, que es la referencia clásica del
      sistema peruano para seguir el precio de la electricidad.
    por_que_importa: "Mirar siempre la misma barra permite comparar semana a semana."

  congestion:
    nombre: "Congestión"
    explicacion_simple: >
      Pasa cuando una línea eléctrica está llena, como una carretera en hora punta,
      y la energía barata no puede llegar a cierta zona.
    por_que_importa: "La congestión hace que el precio cambie de una zona a otra."

  hidro:
    nombre: "Hidroeléctrica"
    explicacion_simple: >
      Electricidad producida con la fuerza del agua de los ríos. Produce más en
      temporada de lluvias (diciembre a abril).
    por_que_importa: "Es una de las fuentes más baratas del Perú."

  gas:
    nombre: "Gas natural"
    explicacion_simple: >
      Centrales que queman gas natural, sobre todo de Camisea, para mover turbinas.
      Cubren lo que el agua, el sol y el viento no alcanzan.
    por_que_importa: "Es la principal fuente térmica del país."

  solar:
    nombre: "Solar"
    explicacion_simple: "Paneles que convierten la luz del sol en electricidad. Solo producen de día, sobre todo en el sur."
    por_que_importa: "Es de las fuentes más baratas y no emite gases al operar."

  eolica:
    nombre: "Eólica"
    explicacion_simple: "Molinos que aprovechan el viento, sobre todo en la costa de Ica, Piura y La Libertad."
    por_que_importa: "Su producción depende de cuánto sople el viento."

  diesel:
    nombre: "Diésel y residual"
    explicacion_simple: "Centrales que queman derivados del petróleo. Se usan poco porque son caras."
    por_que_importa: "Cuando se encienden, el precio suele subir."

  carbon:
    nombre: "Carbón"
    explicacion_simple: "Centrales que queman carbón. En el Perú su uso es muy pequeño."
    por_que_importa: "Es la fuente que más contamina por cada MWh."

  biomasa:
    nombre: "Biomasa"
    explicacion_simple: "Electricidad hecha con residuos de caña de azúcar (bagazo) o biogás de rellenos."
    por_que_importa: "Aprovecha desechos que de otra forma se perderían."

  preliminar:
    nombre: "Dato preliminar"
    explicacion_simple: >
      Un dato que el COES todavía puede corregir porque aún no publicó su evaluación
      final del día.
    por_que_importa: "Los números pueden cambiar un poco cuando el COES los confirme."
