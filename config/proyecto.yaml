# Identidad del proyecto. Para renombrar, cambiar solo estas 3 lineas.
nombre: "Cuánto COESta"
slug: "cuanto-coesta"
tagline: "El sistema eléctrico peruano, explicado al toque"

repositorio: ""   # se completa al crear el repo en GitHub

aviso: >
  Proyecto independiente, no afiliado al COES. Usa datos públicos del portal
  www.coes.org.pe, que pueden ser preliminares y cambiar después.

# Identidad: amigable e institucional, inspirada en los azules del sector electrico.
# Fondo gris azulado muy claro, tarjetas blancas, azul marino y azul vivo, y un
# naranja "energia" solo para lo que pide atencion. Paleta propia (no copia la marca del COES).
paleta:
  marino: "#0E2A47"       # menu lateral, textos principales
  azul: "#1565C0"         # botones, series principales
  celeste: "#E3EEFA"      # resaltados suaves, areas de graficos
  azul_claro: "#7FB8F0"   # barras secundarias
  naranja: "#F28C1E"      # alertas y maximos
  naranja_texto: "#B04F00"
  # Claves usadas por graficos y PDF (mismos colores con nombres funcionales)
  tinta: "#0E2A47"
  papel: "#F4F7FB"
  blanco: "#FFFFFF"
  lima: "#F28C1E"
  verde: "#1565C0"
  gris: "#5B6B7D"
  linea: "#D5DFEA"
  cobre: "#F28C1E"
  mineral: "#16375A"
  primario: "#0E2A47"
  secundario: "#1565C0"
  acento: "#F28C1E"
  fondo: "#F4F7FB"
  fondo_suave: "#FFFFFF"
  texto: "#0E2A47"
  texto_suave: "#5B6B7D"
  sube: "#B23A22"         # cambio desfavorable
  baja: "#1E7A50"         # cambio favorable

# Tipografia (assets/fuentes, licencia OFL). Una sola familia, en varios pesos.
tipografia:
  titulares: "Plus Jakarta Sans"
  texto: "Plus Jakarta Sans"
  mono: "Plus Jakarta Sans"

# Un color fijo por tecnologia en todos los graficos
tecnologias:
  hidro:    {nombre: "Hidroeléctrica",    color: "#2F80D1"}
  gas:      {nombre: "Gas natural",       color: "#F2A33A"}
  solar:    {nombre: "Solar",             color: "#F5C518"}
  eolica:   {nombre: "Eólica",            color: "#2BB3A3"}
  diesel:   {nombre: "Diésel y residual", color: "#4A5563"}
  carbon:   {nombre: "Carbón",            color: "#7A5235"}
  biomasa:  {nombre: "Biomasa",           color: "#6FA84B"}
  termica:  {nombre: "Térmica",           color: "#F2A33A"}
  otros:    {nombre: "Otros",             color: "#B9C7D6"}

# Orden de apilado en graficos (de base a tope)
orden_tecnologias: [hidro, gas, eolica, solar, biomasa, carbon, diesel, otros]
