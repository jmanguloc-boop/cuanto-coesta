# Colores copiados de config/proyecto.yaml (paleta). tests/test_app.py verifica que coincidan.
[theme]
base = "light"
primaryColor = "#0B3C5D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F9"
textColor = "#1D2731"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
