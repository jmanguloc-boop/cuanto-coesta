# Colores copiados de config/proyecto.yaml (paleta). tests/test_app.py verifica que coincidan.
[theme]
base = "light"
primaryColor = "#171916"
backgroundColor = "#F1F0E8"
secondaryBackgroundColor = "#FBFAF5"
textColor = "#171916"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
