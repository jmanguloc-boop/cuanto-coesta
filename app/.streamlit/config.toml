# Colores copiados de config/proyecto.yaml (paleta). tests/test_app.py verifica que coincidan.
[theme]
base = "light"
primaryColor = "#0E2A47"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E2A47"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
